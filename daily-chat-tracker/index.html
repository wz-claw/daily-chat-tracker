<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Chat Stats</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }
        .stat-value {
            font-size: 3em;
            font-weight: bold;
            color: #667eea;
        }
        .stat-label {
            color: #666;
            margin-top: 10px;
            font-size: 1.1em;
        }
        .chart-container {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }
        .chart-title {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .data-table th, .data-table td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }
        .data-table th {
            background: #667eea;
            color: white;
            font-weight: 600;
        }
        .data-table tr:hover {
            background: #f5f5f5;
        }
        .footer {
            text-align: center;
            color: white;
            margin-top: 30px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Daily Chat Statistics</h1>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="totalDays">0</div>
                <div class="stat-label">Total Days</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalHours">0</div>
                <div class="stat-label">Total Hours</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="avgHours">0</div>
                <div class="stat-label">Avg Hours/Day</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="maxHours">0</div>
                <div class="stat-label">Max Hours</div>
            </div>
        </div>

        <div class="chart-container">
            <div class="chart-title">Chat Duration Trend</div>
            <canvas id="trendChart"></canvas>
        </div>

        <table class="data-table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Duration (hours)</th>
                    <th>Notes</th>
                </tr>
            </thead>
            <tbody id="dataTable">
            </tbody>
        </table>

        <div class="footer">
            <p>Last updated: <span id="lastUpdate"></span></p>
        </div>
    </div>

    <script>
        // Chat data - will be updated by GitHub Actions
        const chatData = [];

        // Update statistics
        function updateStats() {
            const totalDays = chatData.length;
            const totalHours = chatData.reduce((sum, item) => sum + item.hours, 0);
            const avgHours = totalDays > 0 ? (totalHours / totalDays).toFixed(1) : 0;
            const maxHours = totalDays > 0 ? Math.max(...chatData.map(item => item.hours)) : 0;

            document.getElementById('totalDays').textContent = totalDays;
            document.getElementById('totalHours').textContent = totalHours.toFixed(1);
            document.getElementById('avgHours').textContent = avgHours;
            document.getElementById('maxHours').textContent = maxHours;
            document.getElementById('lastUpdate').textContent = new Date().toLocaleString('zh-CN');
        }

        // Render chart
        function renderChart() {
            const ctx = document.getElementById('trendChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: chatData.map(item => item.date),
                    datasets: [{
                        label: 'Chat Hours',
                        data: chatData.map(item => item.hours),
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'top',
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'Hours'
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: 'Date'
                            }
                        }
                    }
                }
            });
        }

        // Render data table
        function renderTable() {
            const tbody = document.getElementById('dataTable');
            tbody.innerHTML = chatData.map(item => `
                <tr>
                    <td>${item.date}</td>
                    <td>${item.hours}</td>
                    <td>${item.notes || '-'}</td>
                </tr>
            `).join('');
        }

        // Initialize
        updateStats();
        renderChart();
        renderTable();
    </script>
</body>
</html>
