name: Deploy to GitHub Pages

on:
  push:
    branches: [ gh-pages ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build
        run: |
          # Update index.html with data from data.json
          python3 -c "
          import json
          
          # Read data
          with open('data.json', 'r') as f:
              data = json.load(f)
          
          # Read HTML
          with open('index.html', 'r') as f:
              html = f.read()
          
          # Update chatData in HTML
          data_str = json.dumps(data, indent=2)
          html = html.replace('const chatData = [];', f'const chatData = {data_str};')
          
          # Write back
          with open('index.html', 'w') as f:
              f.write(html)
          "

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
