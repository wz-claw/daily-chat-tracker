<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Chat Stats</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }
        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
        }
        .stat-value.online {
            color: #3b82f6;
        }
        .stat-value.offline {
            color: #f59e0b;
        }
        .stat-label {
            color: #666;
            margin-top: 10px;
            font-size: 1em;
        }
        .chart-container {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }
        .chart-title {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }
        .legend-color.online {
            background: #3b82f6;
        }
        .legend-color.offline {
            background: #f59e0b;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .data-table th, .data-table td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }
        .data-table th {
            background: #667eea;
            color: white;
            font-weight: 600;
        }
        .data-table tr:hover {
            background: #f5f5f5;
        }
        .online-cell {
            color: #3b82f6;
            font-weight: 600;
        }
        .offline-cell {
            color: #f59e0b;
            font-weight: 600;
        }
        .footer {
            text-align: center;
            color: white;
            margin-top: 30px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Daily Chat Statistics</h1>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="totalDays">0</div>
                <div class="stat-label">Total Days</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalHours">0</div>
                <div class="stat-label">Total Hours</div>
            </div>
            <div class="stat-card">
                <div class="stat-value online" id="onlineHours">0</div>
                <div class="stat-label">🔵 Online Hours</div>
            </div>
            <div class="stat-card">
                <div class="stat-value offline" id="offlineHours">0</div>
                <div class="stat-label">🟠 Offline Hours</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="avgHours">0</div>
                <div class="stat-label">Avg Hours/Day</div>
            </div>
        </div>

        <div class="chart-container">
            <div class="chart-title">Chat Duration Trend</div>
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color online"></div>
                    <span>Online</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color offline"></div>
                    <span>Offline</span>
                </div>
            </div>
            <canvas id="trendChart"></canvas>
        </div>

        <table class="data-table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>🔵 Online</th>
                    <th>🟠 Offline</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody id="dataTable">
            </tbody>
        </table>

        <div class="footer">
            <p>Last updated: <span id="lastUpdate"></span></p>
        </div>
    </div>

    <script>
        // Chat data - will be updated by GitHub Actions
        const chatData = [
  {
    "date": "2026-06-02",
    "online": 4,
    "offline": 1
  },
  {
    "date": "2026-06-03",
    "online": 0,
    "offline": 4
  },
  {
    "date": "2026-06-04",
    "online": 6,
    "offline": 0
  },
  {
    "date": "2026-06-06",
    "online": 8,
    "offline": 0
  },
  {
    "date": "2026-06-07",
    "online": 5,
    "offline": 0
  },
  {
    "date": "2026-06-08",
    "online": 0,
    "offline": 2
  }
];

        // Update statistics
        function updateStats() {
            const totalDays = chatData.length;
            const totalOnline = chatData.reduce((sum, item) => sum + item.online, 0);
            const totalOffline = chatData.reduce((sum, item) => sum + item.offline, 0);
            const totalHours = totalOnline + totalOffline;
            const avgHours = totalDays > 0 ? (totalHours / totalDays).toFixed(1) : 0;

            document.getElementById('totalDays').textContent = totalDays;
            document.getElementById('totalHours').textContent = totalHours.toFixed(1);
            document.getElementById('onlineHours').textContent = totalOnline.toFixed(1);
            document.getElementById('offlineHours').textContent = totalOffline.toFixed(1);
            document.getElementById('avgHours').textContent = avgHours;
            document.getElementById('lastUpdate').textContent = new Date().toLocaleString('zh-CN');
        }

        // Render chart
        function renderChart() {
            const ctx = document.getElementById('trendChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: chatData.map(item => item.date),
                    datasets: [
                        {
                            label: 'Online',
                            data: chatData.map(item => item.online),
                            backgroundColor: '#3b82f6',
                            borderRadius: 6
                        },
                        {
                            label: 'Offline',
                            data: chatData.map(item => item.offline),
                            backgroundColor: '#f59e0b',
                            borderRadius: 6
                        }
                    ]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        x: {
                            stacked: true,
                            title: {
                                display: true,
                                text: 'Date'
                            }
                        },
                        y: {
                            stacked: true,
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'Hours'
                            }
                        }
                    }
                }
            });
        }

        // Render data table
        function renderTable() {
            const tbody = document.getElementById('dataTable');
            tbody.innerHTML = chatData.map(item => `
                <tr>
                    <td>${item.date}</td>
                    <td class="online-cell">${item.online > 0 ? item.online + 'h' : '-'}</td>
                    <td class="offline-cell">${item.offline > 0 ? item.offline + 'h' : '-'}</td>
                    <td><strong>${item.online + item.offline}h</strong></td>
                </tr>
            `).join('');
        }

        // Initialize
        updateStats();
        renderChart();
        renderTable();
    </script>
</body>
</html>
