<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日聊天统计</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #faf7f2;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            color: #2d4b73;
            text-align: center;
            margin-bottom: 40px;
            font-size: 2em;
            font-weight: 300;
            letter-spacing: 0.1em;
        }
        h1::before,
        h1::after {
            content: "—";
            margin: 0 15px;
            color: #c16952;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: white;
            border-radius: 8px;
            padding: 20px 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            text-align: center;
            border: 1px solid #e8e4df;
        }
        .stat-value {
            font-size: 2em;
            font-weight: 300;
            color: #2d4b73;
        }
        .stat-value.online {
            color: #2d4b73;
        }
        .stat-value.offline {
            color: #c16952;
        }
        .stat-label {
            color: #888;
            margin-top: 8px;
            font-size: 0.85em;
        }
        .chart-container {
            background: white;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 40px;
            border: 1px solid #e8e4df;
        }
        .chart-title {
            font-size: 1.1em;
            color: #2d4b73;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 300;
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #666;
            font-size: 0.9em;
        }
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 3px;
        }
        .legend-color.online {
            background: #2d4b73;
        }
        .legend-color.offline {
            background: #c16952;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid #e8e4df;
        }
        .data-table th, .data-table td {
            padding: 15px 20px;
            text-align: center;
            border-bottom: 1px solid #f0ece7;
        }
        .data-table th {
            background: #2d4b73;
            color: #faf7f2;
            font-weight: 400;
            font-size: 0.9em;
        }
        .data-table tr:last-child td {
            border-bottom: none;
        }
        .data-table tr:hover {
            background: #faf7f2;
        }
        .online-cell {
            color: #2d4b73;
        }
        .offline-cell {
            color: #c16952;
        }
        .footer {
            text-align: center;
            color: #aaa;
            margin-top: 40px;
            font-size: 0.85em;
        }
        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>每日聊天统计</h1>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="totalDays">0</div>
                <div class="stat-label">记录天数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalHours">0</div>
                <div class="stat-label">总时长</div>
            </div>
            <div class="stat-card">
                <div class="stat-value online" id="onlineHours">0</div>
                <div class="stat-label">线上时长</div>
            </div>
            <div class="stat-card">
                <div class="stat-value offline" id="offlineHours">0</div>
                <div class="stat-label">线下时长</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="avgHours">0</div>
                <div class="stat-label">日均时长</div>
            </div>
        </div>

        <div class="chart-container">
            <div class="chart-title">聊天时长趋势</div>
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color online"></div>
                    <span>线上</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color offline"></div>
                    <span>线下</span>
                </div>
            </div>
            <canvas id="trendChart"></canvas>
        </div>

        <table class="data-table">
            <thead>
                <tr>
                    <th>日期</th>
                    <th>线上</th>
                    <th>线下</th>
                    <th>合计</th>
                </tr>
            </thead>
            <tbody id="dataTable">
            </tbody>
        </table>

        <div class="footer">
            <p>最后更新：<span id="lastUpdate"></span></p>
        </div>
    </div>

    <script>
        // Chat data - will be updated by GitHub Actions
        const chatData = [
  {
    "date": "2026-06-02",
    "online": 4,
    "offline": 1
  },
  {
    "date": "2026-06-03",
    "online": 0,
    "offline": 4
  },
  {
    "date": "2026-06-04",
    "online": 6,
    "offline": 0
  },
  {
    "date": "2026-06-06",
    "online": 8,
    "offline": 0
  },
  {
    "date": "2026-06-07",
    "online": 5,
    "offline": 0
  },
  {
    "date": "2026-06-08",
    "online": 0,
    "offline": 2
  }
];

        // Update statistics
        function updateStats() {
            const totalDays = chatData.length;
            const totalOnline = chatData.reduce((sum, item) => sum + item.online, 0);
            const totalOffline = chatData.reduce((sum, item) => sum + item.offline, 0);
            const totalHours = totalOnline + totalOffline;
            const avgHours = totalDays > 0 ? (totalHours / totalDays).toFixed(1) : 0;

            document.getElementById('totalDays').textContent = totalDays;
            document.getElementById('totalHours').textContent = totalHours.toFixed(1);
            document.getElementById('onlineHours').textContent = totalOnline.toFixed(1);
            document.getElementById('offlineHours').textContent = totalOffline.toFixed(1);
            document.getElementById('avgHours').textContent = avgHours;
            document.getElementById('lastUpdate').textContent = new Date().toLocaleString('zh-CN');
        }

        // Render chart
        function renderChart() {
            const ctx = document.getElementById('trendChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: chatData.map(item => item.date),
                    datasets: [
                        {
                            label: '线上',
                            data: chatData.map(item => item.online),
                            backgroundColor: '#2d4b73',
                            borderRadius: 4
                        },
                        {
                            label: '线下',
                            data: chatData.map(item => item.offline),
                            backgroundColor: '#c16952',
                            borderRadius: 4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        x: {
                            stacked: true,
                            grid: {
                                display: false
                            }
                        },
                        y: {
                            stacked: true,
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: '小时',
                                color: '#888'
                            },
                            grid: {
                                color: '#f0ece7'
                            }
                        }
                    }
                }
            });
        }

        // Render data table
        function renderTable() {
            const tbody = document.getElementById('dataTable');
            tbody.innerHTML = chatData.map(item => `
                <tr>
                    <td>${item.date}</td>
                    <td class="online-cell">${item.online > 0 ? item.online + 'h' : '-'}</td>
                    <td class="offline-cell">${item.offline > 0 ? item.offline + 'h' : '-'}</td>
                    <td><strong>${item.online + item.offline}h</strong></td>
                </tr>
            `).join('');
        }

        // Initialize
        updateStats();
        renderChart();
        renderTable();
    </script>
</body>
</html>
