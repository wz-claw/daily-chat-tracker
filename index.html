<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日聊天统计</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f8faf9;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 960px;
            margin: 0 auto;
        }
        h1 {
            color: #2d3748;
            text-align: center;
            margin-bottom: 40px;
            font-size: 1.8em;
            font-weight: 600;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        .stat-value {
            font-size: 2em;
            font-weight: 700;
            color: #1a365d;
        }
        .stat-value.online {
            color: #6b9dc2;
        }
        .stat-value.offline {
            color: #7cc49a;
        }
        .stat-label {
            color: #718096;
            margin-top: 6px;
            font-size: 0.85em;
        }
        .chart-container {
            background: white;
            border-radius: 12px;
            padding: 28px;
            margin-bottom: 32px;
            border: 1px solid #e2e8f0;
        }
        .chart-title {
            font-size: 1em;
            color: #4a5568;
            margin-bottom: 16px;
            font-weight: 500;
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 16px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #718096;
            font-size: 0.9em;
        }
        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .legend-dot.online {
            background: #6b9dc2;
        }
        .legend-dot.offline {
            background: #7cc49a;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }
        .data-table th, .data-table td {
            padding: 14px 20px;
            text-align: center;
        }
        .data-table th {
            background: #f7fafc;
            color: #4a5568;
            font-weight: 500;
            font-size: 0.9em;
            border-bottom: 1px solid #e2e8f0;
        }
        .data-table td {
            border-bottom: 1px solid #edf2f7;
        }
        .data-table tr:last-child td {
            border-bottom: none;
        }
        .data-table tr:hover td {
            background: #f7fafc;
        }
        .online-cell {
            color: #6b9dc2;
            font-weight: 500;
        }
        .offline-cell {
            color: #7cc49a;
            font-weight: 500;
        }
        .footer {
            text-align: center;
            color: #a0aec0;
            margin-top: 32px;
            font-size: 0.8em;
        }
        .range-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 24px;
            color: #718096;
            font-size: 0.9em;
        }
        .range-bar input {
            width: 72px;
            padding: 6px 10px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 0.95em;
            text-align: center;
            color: #2d3748;
        }
        .range-bar input:focus {
            outline: none;
            border-color: #6b9dc2;
        }
        .range-bar button {
            padding: 6px 14px;
            border: none;
            border-radius: 8px;
            background: #6b9dc2;
            color: white;
            font-size: 0.9em;
            cursor: pointer;
        }
        .range-bar button:hover {
            background: #5a8ab0;
        }
        .range-bar button.reset {
            background: #edf2f7;
            color: #4a5568;
        }
        .range-bar button.reset:hover {
            background: #e2e8f0;
        }
        .range-bar .current-range {
            color: #6b9dc2;
            font-weight: 500;
        }
        .range-bar .emoji-toggle {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-left: 12px;
            cursor: pointer;
            user-select: none;
        }
        .range-bar .emoji-toggle input {
            width: auto;
            accent-color: #6b9dc2;
            cursor: pointer;
        }
        @media (max-width: 768px) {
            body {
                padding: 20px 12px;
            }
            h1 {
                font-size: 1.4em;
                margin-bottom: 24px;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .stat-card {
                padding: 14px;
            }
            .stat-value {
                font-size: 1.5em;
            }
            .chart-container {
                padding: 16px;
            }
            .data-table {
                font-size: 0.85em;
            }
            .data-table th, .data-table td {
                padding: 10px 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>每日聊天统计</h1>

        <div class="range-bar">
            查看范围：过去
            <input type="number" id="rangeDays" min="1" placeholder="天数">
            天
            <button id="applyRange">应用</button>
            <button id="resetRange" class="reset">全部</button>
            <span class="current-range" id="currentRange"></span>
            <label class="emoji-toggle">
                <input type="checkbox" id="showEmoji" checked>
                显示表情
            </label>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="totalDays">0</div>
                <div class="stat-label">记录天数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalHours">0</div>
                <div class="stat-label">总时长</div>
            </div>
            <div class="stat-card">
                <div class="stat-value online" id="onlineHours">0</div>
                <div class="stat-label">线上</div>
            </div>
            <div class="stat-card">
                <div class="stat-value offline" id="offlineHours">0</div>
                <div class="stat-label">线下</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="avgHours">0</div>
                <div class="stat-label">日均</div>
            </div>
        </div>

        <div class="chart-container">
            <div class="chart-title">趋势</div>
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-dot online"></div>
                    <span>线上</span>
                </div>
                <div class="legend-item">
                    <div class="legend-dot offline"></div>
                    <span>线下</span>
                </div>
            </div>
            <canvas id="trendChart"></canvas>
        </div>

        <table class="data-table">
            <thead>
                <tr>
                    <th>日期</th>
                    <th>线上</th>
                    <th>线下</th>
                    <th>合计</th>
                    <th>备注</th>
                </tr>
            </thead>
            <tbody id="dataTable">
            </tbody>
        </table>

        <div class="footer">
            最后更新：<span id="lastUpdate"></span>
        </div>
    </div>

    <script>
        fetch('data.json')
            .then(r => r.json())
            .then(chatData => {
                let currentData = chatData;
                let trendChart = null;

                function updateStats() {
            const totalDays = currentData.length;
            const totalOnline = currentData.reduce((sum, item) => sum + item.online, 0);
            const totalOffline = currentData.reduce((sum, item) => sum + item.offline, 0);
            const totalHours = totalOnline + totalOffline;
            const avgHours = totalDays > 0 ? (totalHours / totalDays).toFixed(1) : 0;

            document.getElementById('totalDays').textContent = totalDays;
            document.getElementById('totalHours').textContent = totalHours.toFixed(1);
            document.getElementById('onlineHours').textContent = totalOnline.toFixed(1);
            document.getElementById('offlineHours').textContent = totalOffline.toFixed(1);
            document.getElementById('avgHours').textContent = avgHours;
            document.getElementById('lastUpdate').textContent = new Date().toLocaleString('zh-CN');
        }

        function applyRange() {
            const input = document.getElementById('rangeDays');
            const days = parseInt(input.value, 10);
            const label = document.getElementById('currentRange');
            if (!days || days < 1) {
                return;
            }
            currentData = chatData.slice(-days);
            label.textContent = days >= chatData.length
                ? `（全部 ${chatData.length} 天）`
                : `（过去 ${days} 天）`;
            updateStats();
            renderChart();
        }

        function resetRange() {
            currentData = chatData;
            document.getElementById('rangeDays').value = '';
            document.getElementById('currentRange').textContent = '';
            updateStats();
            renderChart();
        }

        document.getElementById('applyRange').addEventListener('click', applyRange);
        document.getElementById('resetRange').addEventListener('click', resetRange);
        document.getElementById('rangeDays').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') applyRange();
        });
        document.getElementById('showEmoji').addEventListener('change', renderChart);

        function renderChart() {
            Chart.register(ChartDataLabels);
            if (trendChart) {
                trendChart.destroy();
            }
            const viewData = currentData;
            const showEmoji = document.getElementById('showEmoji').checked;
            const notePlugin = {
                id: 'notePlugin',
                afterDatasetsDraw(chart) {
                    if (!showEmoji) return;
                    const ctx = chart.ctx;
                    const meta0 = chart.getDatasetMeta(0);
                    const meta1 = chart.getDatasetMeta(1);
                    viewData.forEach((item, i) => {
                        if (!item.note) return;
                        const bar = meta1.data[i] || meta0.data[i];
                        const top = Math.min(
                            meta0.data[i]?.y ?? Infinity,
                            meta1.data[i]?.y ?? Infinity
                        );
                        ctx.save();
                        ctx.font = '16px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText(Array.from(item.note)[0], bar.x, top - 8);
                        ctx.restore();
                    });
                }
            };
            const ctx = document.getElementById('trendChart').getContext('2d');
            trendChart = new Chart(ctx, {
                type: 'bar',
                plugins: [notePlugin],
                data: {
                    labels: viewData.map(item => item.date),
                    datasets: [
                        {
                            label: '线上',
                            data: viewData.map(item => item.online),
                            backgroundColor: '#6b9dc2',
                            borderRadius: 0,
                            borderSkipped: 'start',
                            datalabels: {
                                display: true,
                                color: 'white',
                                font: { weight: 'bold', size: 12 },
                                formatter: (value) => value > 0 ? value + 'h' : '',
                                anchor: 'center',
                                align: 'center'
                            }
                        },
                        {
                            label: '线下',
                            data: viewData.map(item => item.offline),
                            backgroundColor: '#7cc49a',
                            borderRadius: 0,
                            borderSkipped: 'start',
                            datalabels: {
                                display: true,
                                color: 'white',
                                font: { weight: 'bold', size: 12 },
                                formatter: (value) => value > 0 ? value + 'h' : '',
                                anchor: 'center',
                                align: 'center'
                            }
                        }
                    ]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false },
                        datalabels: {
                            display: true,
                            color: 'white',
                            font: {
                                weight: 'bold',
                                size: 12
                            },
                            formatter: (value) => value > 0 ? value + 'h' : '',
                            anchor: 'center',
                            align: 'center'
                        }
                    },
                    scales: {
                        x: {
                            stacked: true,
                            grid: { display: false }
                        },
                        y: {
                            stacked: true,
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: '小时',
                                color: '#a0aec0'
                            },
                            grid: { color: '#edf2f7' }
                        }
                    }
                }
            });
        }

        function renderTable() {
            const tbody = document.getElementById('dataTable');
            tbody.innerHTML = chatData.map(item => `
                <tr>
                    <td>${item.date}</td>
                    <td class="online-cell">${item.online > 0 ? item.online + 'h' : '-'}</td>
                    <td class="offline-cell">${item.offline > 0 ? item.offline + 'h' : '-'}</td>
                    <td><strong>${item.online + item.offline}h</strong></td>
                    <td>${item.note || ''}</td>
                </tr>
            `).join('');
        }

                updateStats();
                renderChart();
                renderTable();
            });
    </script>
</body>
</html>
