<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日聊天统计</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f8faf9;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 960px;
            margin: 0 auto;
        }
        h1 {
            color: #2d3748;
            text-align: center;
            margin-bottom: 40px;
            font-size: 1.8em;
            font-weight: 600;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        .stat-value {
            font-size: 2em;
            font-weight: 700;
            color: #1a365d;
        }
        .stat-value.online {
            color: #6b9dc2;
        }
        .stat-value.offline {
            color: #7cc49a;
        }
        .stat-label {
            color: #718096;
            margin-top: 6px;
            font-size: 0.85em;
        }
        .chart-container {
            background: white;
            border-radius: 12px;
            padding: 28px;
            margin-bottom: 32px;
            border: 1px solid #e2e8f0;
        }
        .chart-title {
            font-size: 1em;
            color: #4a5568;
            margin-bottom: 16px;
            font-weight: 500;
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 16px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #718096;
            font-size: 0.9em;
        }
        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .legend-dot.online {
            background: #6b9dc2;
        }
        .legend-dot.offline {
            background: #7cc49a;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }
        .data-table th, .data-table td {
            padding: 14px 20px;
            text-align: center;
        }
        .data-table th {
            background: #f7fafc;
            color: #4a5568;
            font-weight: 500;
            font-size: 0.9em;
            border-bottom: 1px solid #e2e8f0;
        }
        .data-table td {
            border-bottom: 1px solid #edf2f7;
        }
        .data-table tr:last-child td {
            border-bottom: none;
        }
        .data-table tr:hover td {
            background: #f7fafc;
        }
        .online-cell {
            color: #6b9dc2;
            font-weight: 500;
        }
        .offline-cell {
            color: #7cc49a;
            font-weight: 500;
        }
        .footer {
            text-align: center;
            color: #a0aec0;
            margin-top: 32px;
            font-size: 0.8em;
        }
        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>每日聊天统计</h1>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="totalDays">0</div>
                <div class="stat-label">记录天数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalHours">0</div>
                <div class="stat-label">总时长</div>
            </div>
            <div class="stat-card">
                <div class="stat-value online" id="onlineHours">0</div>
                <div class="stat-label">线上</div>
            </div>
            <div class="stat-card">
                <div class="stat-value offline" id="offlineHours">0</div>
                <div class="stat-label">线下</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="avgHours">0</div>
                <div class="stat-label">日均</div>
            </div>
        </div>

        <div class="chart-container">
            <div class="chart-title">趋势</div>
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-dot online"></div>
                    <span>线上</span>
                </div>
                <div class="legend-item">
                    <div class="legend-dot offline"></div>
                    <span>线下</span>
                </div>
            </div>
            <canvas id="trendChart"></canvas>
        </div>

        <table class="data-table">
            <thead>
                <tr>
                    <th>日期</th>
                    <th>线上</th>
                    <th>线下</th>
                    <th>合计</th>
                </tr>
            </thead>
            <tbody id="dataTable">
            </tbody>
        </table>

        <div class="footer">
            最后更新：<span id="lastUpdate"></span>
        </div>
    </div>

    <script>
        const chatData = [
  {
    "date": "2026-06-02",
    "online": 4,
    "offline": 1
  },
  {
    "date": "2026-06-03",
    "online": 0,
    "offline": 4
  },
  {
    "date": "2026-06-04",
    "online": 6,
    "offline": 0
  },
  {
    "date": "2026-06-06",
    "online": 8,
    "offline": 0
  },
  {
    "date": "2026-06-07",
    "online": 5,
    "offline": 0
  },
  {
    "date": "2026-06-08",
    "online": 0,
    "offline": 2
  }
];

        function updateStats() {
            const totalDays = chatData.length;
            const totalOnline = chatData.reduce((sum, item) => sum + item.online, 0);
            const totalOffline = chatData.reduce((sum, item) => sum + item.offline, 0);
            const totalHours = totalOnline + totalOffline;
            const avgHours = totalDays > 0 ? (totalHours / totalDays).toFixed(1) : 0;

            document.getElementById('totalDays').textContent = totalDays;
            document.getElementById('totalHours').textContent = totalHours.toFixed(1);
            document.getElementById('onlineHours').textContent = totalOnline.toFixed(1);
            document.getElementById('offlineHours').textContent = totalOffline.toFixed(1);
            document.getElementById('avgHours').textContent = avgHours;
            document.getElementById('lastUpdate').textContent = new Date().toLocaleString('zh-CN');
        }

        function renderChart() {
            const ctx = document.getElementById('trendChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: chatData.map(item => item.date),
                    datasets: [
                        {
                            label: '线上',
                            data: chatData.map(item => item.online),
                            backgroundColor: '#6b9dc2',
                            borderRadius: 0,
                            borderSkipped: 'start'
                        },
                        {
                            label: '线下',
                            data: chatData.map(item => item.offline),
                            backgroundColor: '#7cc49a',
                            borderRadius: 0,
                            borderSkipped: 'start'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: {
                            stacked: true,
                            grid: { display: false }
                        },
                        y: {
                            stacked: true,
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: '小时',
                                color: '#a0aec0'
                            },
                            grid: { color: '#edf2f7' }
                        }
                    }
                }
            });
        }

        function renderTable() {
            const tbody = document.getElementById('dataTable');
            tbody.innerHTML = chatData.map(item => `
                <tr>
                    <td>${item.date}</td>
                    <td class="online-cell">${item.online > 0 ? item.online + 'h' : '-'}</td>
                    <td class="offline-cell">${item.offline > 0 ? item.offline + 'h' : '-'}</td>
                    <td><strong>${item.online + item.offline}h</strong></td>
                </tr>
            `).join('');
        }

        updateStats();
        renderChart();
        renderTable();
    </script>
</body>
</html>
